<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>门店客源管理实战 - 播放器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .player {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .stage {
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .slide-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: #000;
      }

      .hotspot {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 50%;
        z-index: 5;
        cursor: pointer;
      }

      .hotspot.left {
        left: 0;
      }

      .hotspot.right {
        right: 0;
      }

      .page-indicator {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 6;
        font-size: 12px;
        color: #cbd5e1;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="player">
      <div class="stage">
        <img id="slideImage" class="slide-image" alt="PPT 幻灯片" />
      </div>
    </div>

    <div class="hotspot left" id="hotspotPrev" aria-label="上一页"></div>
    <div class="hotspot right" id="hotspotNext" aria-label="下一页"></div>
    <div id="pageIndicator" class="page-indicator"></div>

    <script>
      (function() {
        var TOTAL = 17;
        var current = 0;
        var slideImage = document.getElementById('slideImage');
        var pageIndicator = document.getElementById('pageIndicator');

        function clamp(v, min, max) {
          return Math.max(min, Math.min(max, v));
        }

        function parseHash() {
          var n = parseInt((window.location.hash || '').replace('#', ''), 10);
          if (Number.isNaN(n)) return 0;
          return clamp(n, 0, TOTAL - 1);
        }

        function slidePath(index) {
          var page = String(index + 1).padStart(3, '0');
          return './slides/' + page + '.png';
        }

        function render(index, syncHash) {
          current = clamp(index, 0, TOTAL - 1);
          slideImage.src = slidePath(current);
          pageIndicator.textContent = '第 ' + (current + 1) + ' 页 / 共 ' + TOTAL + ' 页';
          if (syncHash !== false) {
            window.history.replaceState(null, '', '#' + current);
          }
        }

        function prev() {
          render(current - 1, true);
        }

        function next() {
          render(current + 1, true);
        }

        function requestFullscreen() {
          var el = document.documentElement;
          var fn =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.mozRequestFullScreen ||
            el.msRequestFullscreen;
          if (fn) {
            try {
              fn.call(el);
            } catch (error) {
              // Ignore fullscreen errors silently.
            }
          }
        }

        document.getElementById('hotspotPrev').addEventListener('click', prev);
        document.getElementById('hotspotNext').addEventListener('click', next);

        document.addEventListener('keydown', function(e) {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            prev();
          }
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
            e.preventDefault();
            next();
          }
        });

        window.addEventListener('hashchange', function() {
          render(parseHash(), false);
        });

        render(parseHash(), false);
        setTimeout(requestFullscreen, 0);
      })();
    </script>
  </body>
</html>
